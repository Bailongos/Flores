<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/garden-extras.css">
    <link rel="stylesheet" href="css/living-garden.css">
    <link rel="stylesheet" href="css/enchanted.css">
    <link rel="stylesheet" href="css/day-cycle.css">
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
    <title>Tu jardín de flores 🌼</title>
</head>

<body class="container">
    <div class="time-sky" aria-hidden="true"><div class="celestial sun"></div><div class="celestial moon"></div><div class="time-horizon"></div></div>
    <div class="garden-clock" id="garden-clock" role="group" aria-label="Reloj del jardín, un día dura dos minutos">
      <span class="clock-symbol" id="clock-symbol" aria-hidden="true">🌅</span>
      <div class="clock-meta"><span class="clock-phase" id="clock-phase">Amanecer</span><span class="clock-time" id="clock-time">05:30</span><span class="clock-day" id="clock-day">Día 1 · Tiempo mágico</span></div>
      <button id="clock-toggle" class="clock-pause" type="button" aria-label="Pausar ciclo de día y noche" aria-pressed="false">⏸</button>
    </div>
    <div class="garden-ui">
      <header class="garden-heading"><div class="garden-kicker">✧ UN JARDÍN DE ENSUEÑO ✧</div><h1>Donde florece<br>la magia.</h1><p>Un universo de flores, hadas y estrellas creado especialmente para ti ✧</p></header>
      <nav class="garden-actions" aria-label="Opciones del jardín">
        <button id="wish-button" type="button">💌 Un mensaje para ti</button>
        <button id="petal-button" type="button">🌸 Lluvia de flores</button>
        <button id="spell-button" class="spell-button" type="button">✧ Lanzar hechizo</button>
        <button id="animals-toggle" class="animals-toggle" type="button" aria-pressed="false">⏸ Pausar animalitos</button>
        <a href="index.html">↶ Volver</a>
      </nav>
    </div>
    <div class="wish-toast" id="wish-toast" role="status" aria-live="polite" hidden></div>
    <div class="living-garden" aria-hidden="true"></div>
    <div class="enchanted-world" aria-hidden="true"><div class="aurora"></div><div class="star-field"></div><div class="glow-pool"></div></div>
    <div class="night"></div>
    <div class="flowers">
      <div class="flower flower--1">
        <div class="flower__leafs flower__leafs--1">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__white-circle"></div>

          <div class="flower__light flower__light--1"></div>
          <div class="flower__light flower__light--2"></div>
          <div class="flower__light flower__light--3"></div>
          <div class="flower__light flower__light--4"></div>
          <div class="flower__light flower__light--5"></div>
          <div class="flower__light flower__light--6"></div>
          <div class="flower__light flower__light--7"></div>
          <div class="flower__light flower__light--8"></div>

        </div>
        <div class="flower__line">
          <div class="flower__line__leaf flower__line__leaf--1"></div>
          <div class="flower__line__leaf flower__line__leaf--2"></div>
          <div class="flower__line__leaf flower__line__leaf--3"></div>
          <div class="flower__line__leaf flower__line__leaf--4"></div>
          <div class="flower__line__leaf flower__line__leaf--5"></div>
          <div class="flower__line__leaf flower__line__leaf--6"></div>
        </div>
      </div>

      <div class="flower flower--2">
        <div class="flower__leafs flower__leafs--2">

          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__white-circle"></div>

          <div class="flower__light flower__light--1"></div>
          <div class="flower__light flower__light--2"></div>
          <div class="flower__light flower__light--3"></div>
          <div class="flower__light flower__light--4"></div>
          <div class="flower__light flower__light--5"></div>
          <div class="flower__light flower__light--6"></div>
          <div class="flower__light flower__light--7"></div>

        </div>
        <div class="flower__line">
          <div class="flower__line__leaf flower__line__leaf--1"></div>

          <div class="flower__line__leaf flower__line__leaf--3"></div>
          <div class="flower__line__leaf flower__line__leaf--4"></div>

      <div class="flower flower--3">

          <div class="flower__leaf flower__leaf--4"></div>

          <div class="flower__light flower__light--4"></div>

          <div class="flower__line__leaf flower__line__leaf--3"></div>
          <div class="flower__line__leaf flower__line__leaf--4"></div>
        </div>
      </div>

      <div class="grow-ans" style="--d:1.2s">
        <div class="flower__g-long">
          <div class="flower__g-long__top"></div>
          <div class="flower__g-long__bottom"></div>
        </div>
      </div>

      <div class="growing-grass">
        <div class="flower__grass flower__grass--1">
          <div class="flower__grass--top"></div>
          <div class="flower__grass--bottom"></div>
          <div class="flower__grass__leaf flower__grass__leaf--1"></div>
          <div class="flower__grass__leaf flower__grass__leaf--2"></div>
          <div class="flower__grass__leaf flower__grass__leaf--3"></div>

      <div class="grow-ans" style="--d:2.8s">
        <div class="flower__g-right flower__g-right--2">
          <div class="leaf"></div>
        </div>
      </div>

      <div class="grow-ans" style="--d:2.8s">
        <div class="flower__g-front">
          <div class="flower__g-front__leaf-wrapper flower__g-front__leaf-wrapper--1">
            <div class="flower__g-front__leaf"></div>
          </div>
          <div class="flower__g-front__leaf-wrapper flower__g-front__leaf-wrapper--2">

          </div>
          <div class="flower__g-front__line"></div>
        </div>
      </div>

      <div class="grow-ans" style="--d:3.2s">
        <div class="flower__g-fr">
          <div class="leaf"></div>
          <div class="flower__g-fr__leaf flower__g-fr__leaf--1"></div>
          <div class="flower__g-fr__leaf flower__g-fr__leaf--2"></div>

          <div class="flower__g-fr__leaf flower__g-fr__leaf--7"></div>
          <div class="flower__g-fr__leaf flower__g-fr__leaf--8"></div>
        </div>
      </div>

      <div class="long-g long-g--0">
        <div class="grow-ans" style="--d:3s">
          <div class="leaf leaf--0"></div>
        </div>

          <div class="leaf leaf--1"></div>
